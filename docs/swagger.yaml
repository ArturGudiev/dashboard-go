basePath: /
definitions:
  ent.LogMessage:
    properties:
      container_id:
        description: ContainerID holds the value of the "container_id" field.
        type: integer
      container_type:
        allOf:
        - $ref: '#/definitions/schema.ContainerType'
        description: ContainerType holds the value of the "container_type" field.
      created:
        description: Created holds the value of the "created" field.
        type: string
      description:
        description: Description holds the value of the "description" field.
        type: string
      id:
        description: ID of the ent.
        type: integer
      notes:
        description: Notes holds the value of the "notes" field.
        type: string
    type: object
  ent.RepetitiveTask:
    properties:
      closed:
        description: Closed holds the value of the "closed" field.
        type: boolean
      description:
        description: Description holds the value of the "description" field.
        type: string
      edges:
        allOf:
        - $ref: '#/definitions/ent.RepetitiveTaskEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the RepetitiveTaskQuery when eager-loading is set.
      id:
        description: ID of the ent.
        type: integer
      notes:
        description: Notes holds the value of the "notes" field.
        type: string
      once_in_days:
        description: OnceInDays holds the value of the "once_in_days" field.
        type: integer
      once_in_months:
        description: OnceInMonths holds the value of the "once_in_months" field.
        type: integer
      once_in_weeks:
        description: OnceInWeeks holds the value of the "once_in_weeks" field.
        type: integer
      tags:
        description: Tags holds the value of the "tags" field.
        items:
          type: string
        type: array
    type: object
  ent.RepetitiveTaskEdges:
    properties:
      executions:
        description: Executions holds the value of the executions edge.
        items:
          $ref: '#/definitions/ent.RepetitiveTaskExecution'
        type: array
    type: object
  ent.RepetitiveTaskExecution:
    properties:
      comments:
        description: Comments holds the value of the "comments" field.
        type: string
      edges:
        allOf:
        - $ref: '#/definitions/ent.RepetitiveTaskExecutionEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the RepetitiveTaskExecutionQuery when eager-loading is set.
      execution_date:
        description: ExecutionDate holds the value of the "execution_date" field.
        type: string
      id:
        description: ID of the ent.
        type: integer
      repetitive_task_id:
        description: RepetitiveTaskID holds the value of the "repetitive_task_id"
          field.
        type: integer
    type: object
  ent.RepetitiveTaskExecutionEdges:
    properties:
      repetitive_task:
        allOf:
        - $ref: '#/definitions/ent.RepetitiveTask'
        description: RepetitiveTask holds the value of the repetitive_task edge.
    type: object
  ent.Task:
    properties:
      description:
        description: Description holds the value of the "description" field.
        type: string
      done:
        description: Done holds the value of the "done" field.
        type: boolean
      done_date_time:
        description: DoneDateTime holds the value of the "done_date_time" field.
        type: string
      id:
        description: ID of the ent.
        type: integer
      notes:
        description: Notes holds the value of the "notes" field.
        type: string
      tags:
        description: Tags holds the value of the "tags" field.
        items:
          type: string
        type: array
    type: object
  handlers.AnswerQuestionRequest:
    properties:
      answer:
        type: string
    required:
    - answer
    type: object
  handlers.IDsRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  handlers.NewLogMessageRequest:
    properties:
      containerID:
        type: integer
      containerType:
        $ref: '#/definitions/schema.ContainerType'
      description:
        type: string
      logType:
        type: string
    type: object
  handlers.NewProblemRequest:
    description: Request to create a new problem with optional parent container
    properties:
      parent:
        $ref: '#/definitions/models.ContainerDescription'
      problem:
        $ref: '#/definitions/models.ProblemShort'
    type: object
  handlers.NewQuestionRequest:
