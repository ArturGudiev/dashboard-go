host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: |-
    Task management dashboard API server.
    **Authentication:** Use `POST /users/login`, copy `accessToken` from the response, then click **Authorize** and paste it as the `access_token` cookie value. Alternatively, login from Swagger on the same host and cookies are sent automatically.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Dashboard API
  version: "1.0"
paths:
  /:
    get:
      consumes:
      - application/json
      description: Returns a welcome message
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Root endpoint
      tags:
      - general
  /add-anonymous-task:
    put:
      consumes:
      - application/json
      description: Creates a simple anonymous task with default values
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ent.Task'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create anonymous task
      tags:
      - tasks
  /aliases/{alias}:
    get:
      consumes:
      - application/json
      description: Returns an alias by its string
      parameters:
      - description: Alias
        in: path
        name: alias
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AliasModel'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get alias by string
      tags:
      - aliases
  /answer-question/{id}:
    post:
      consumes:
      - application/json
      description: Sets the answer for a question
      parameters:
      - description: Question ID
        in: path
        name: id
        required: true
        type: integer
      - description: Answer request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AnswerQuestionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.QuestionFull'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Answer question
      tags:
      - questions
  /change-tasks-order:
    post:
      consumes:
      - application/json
      description: Changes the order of tasks in a container
      parameters:
      - description: Change tasks order request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ChangeTasksOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Change tasks order
      tags:
      - tasks
  /container-variables:
    post:
      consumes:
      - application/json
      description: Creates a variable entry for the given container (creates variables
        stack if needed)
      parameters:
      - description: Variable creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AddContainerVariableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ent.ContainerVariables'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add variable to container
      tags:
      - container variables
  /container-variables/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a container variable by ID
      parameters:
      - description: Container variable ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove container variable
      tags:
      - container variables
    patch:
      consumes:
      - application/json
      description: Partially updates a container variable's name and/or value
      parameters:
      - description: Container variable ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.PatchContainerVariableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ent.ContainerVariables'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update container variable
      tags:
      - container variables
  /directions:
    get:
      consumes:
      - application/json
      description: Returns all directions; use open=true to return only open directions
      parameters:
      - description: Return only open directions
        in: query
        name: open
        type: boolean
      produces:
