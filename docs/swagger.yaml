host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Task management dashboard API server
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Dashboard API
  version: "1.0"
paths:
  /:
    get:
      consumes:
      - application/json
      description: Returns a welcome message
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Root endpoint
      tags:
      - general
  /add-anonymous-task:
    put:
      consumes:
      - application/json
      description: Creates a simple anonymous task with default values
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ent.Task'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create anonymous task
      tags:
      - tasks
  /aliases/{alias}:
    get:
      consumes:
      - application/json
      description: Returns an alias by its string
      parameters:
      - description: Alias
        in: path
        name: alias
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AliasModel'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get alias by string
      tags:
      - aliases
  /answer-question/{id}:
    post:
      consumes:
      - application/json
      description: Sets the answer for a question
      parameters:
      - description: Question ID
        in: path
        name: id
        required: true
        type: integer
      - description: Answer request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AnswerQuestionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.QuestionFull'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Answer question
      tags:
      - questions
  /done-tasks:
    get:
      consumes:
      - application/json
      description: Returns all done tasks where doneDateTime is today
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ent.Task'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get done tasks from today
      tags:
      - tasks
  /epic/{id}:
    get:
      consumes:
      - application/json
      description: Returns a epic by its ID
      parameters:
      - description: Epic ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EpicFull'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get epic by ID
      tags:
      - epics
  /epics:
    get:
      consumes:
      - application/json
      description: Returns all epics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.EpicFull'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get epics
      tags:
      - epics
  /finish-task/{id}:
    put:
      consumes:
      - application/json
      description: Marks a task and all its descendants as done
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TaskResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Finish task recursively
      tags:
      - tasks
  /finish-tasks-by-ids/:
    put:
      consumes:
      - application/json
      description: Marks tasks by their IDs and all their descendants as done
      parameters:
      - description: List of task IDs
        in: body
        name: request
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Finish tasks by IDs recursively
      tags:
      - tasks
  /finish-tasks/:
    put:
      consumes:
      - application/json
      description: Marks multiple tasks and all their descendants as done
      parameters:
      - description: List of task IDs
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/handlers.TaskIDRequest'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Finish multiple tasks recursively
      tags:
      - tasks
  /get-epics:
    post:
      consumes:
      - application/json
      description: Returns multiple epics by their IDs
      parameters:
      - description: List of epic IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.IDsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.EpicFull'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get epics by IDs
      tags:
      - epics
  /get-problems:
    post:
      consumes:
      - application/json
      description: Returns multiple problems by their IDs
      parameters:
      - description: List of problem IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.IDsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
